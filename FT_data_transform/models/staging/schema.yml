models:

  - name: stg_departments
    description: >
      Staging model for the French departments referential. This model standardizes
      column names and data types from the raw departments source.
    columns:
      - name: department_id
        description: Department code (e.g. "75", "2A")
        data_tests:
          - unique
          - not_null
      - name: department_name
        description: Department name
        data_tests:
          - not_null
      - name: region_id
        description: Id of the region the department belongs to
        data_tests:
          - not_null

  - name: stg_regions
    description: >
      Staging model for the French regions referential. This model standardizes
      column names and data types from the raw regions source.
    columns:
      - name: region_id
        description: Region code
        data_tests:
          - unique
          - not_null
      - name: region_name
        description: Region name
        data_tests:
          - not_null            

  - name: stg_domains
    description: >
      Staging model for the job domains referential.
    columns:
      - name: domain_id
        description: Domain code
        data_tests:
          - unique
          - not_null
      - name: domain_name
        description: Domain label
      - name: domain_name_url
        description: Domain label url

  - name: stg_subdomains
    description: >
      Staging model for the job subdomains referential.
    columns:
      - name: subdomain_id
        description: Subdomain surrogate id
        data_tests:
          - unique
          - not_null
      - name: subdomain_name
        description: Subdomain label
      - name: domain_id
        description: Id of the domain the subdomain belongs to
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_domains')
                field: domain_id
              config:
                severity: warn

  - name: stg_jobs
    description: >
      Staging model for the jobs referential enriched with national attributes.
    columns:
      - name: rome_code
        description: ROME code of the job
        data_tests:
          - unique
          - not_null
      - name: job_name
        description: Job label
      - name: salaryq10
        description: National 10th percentile salary
      - name: salaryq90
        description: National 90th percentile salary
      - name: job_seekers_national
        description: Number of job seekers reported for the national territory
      - name: job_offers_national
        description: Number of job offers reported for the national territory
      - name: recruitement_difficulty_score
        description: National recruitment difficulty score
      - name: recruitement_difficulty_score_year
        description: Year the recruitment difficulty score refers to

  - name: stg_jobs_subdomains
    description: >
      Staging model for the bridge table between jobs and subdomains.
    columns:
      - name: rome_code
        description: ROME code of the job
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: rome_code
              config:
                severity: warn
      - name: subdomain_id
        description: Id of the subdomain the job belongs to
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subdomains')
                field: subdomain_id
              config:
                severity: warn

  - name: stg_jobs_departments
    description: >
      Staging model for jobs attributes at department level.
    columns:
      - name: rome_code
        description: ROME code of the job
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: rome_code
              config:
                severity: warn
      - name: department_id
        description: Department code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id
              config:
                severity: warn
      - name: job_seekers
        description: Number of job seekers in the department over the 12 months preceding source_period
      - name: job_offers
        description: Number of job offers in the department over the 12 months preceding source_period
      - name: source_period
        description: Reference period to which the data relates, as defined by France Travail
      - name: salaryq10
        description: 10th percentile salary in the department
      - name: salaryq90
        description: 90th percentile salary in the department
      - name: recruitement_difficulty_score
        description: Recruitment difficulty score in the department
      - name: recruitement_difficulty_score_year
        description: Year the recruitment difficulty score refers to