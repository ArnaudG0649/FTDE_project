models:
  - name: stg_green_tripdata
    description: >
      Staging model for green taxi trip data. This model standardizes column names
      and data types from the raw green_tripdata source, providing a clean foundation
      for downstream transformations.
    columns:
      - name: trip_id
        description: ""
        data_tests: 
          - unique: 
              config:
                severity: warn
          - not_null: 
              config:
                severity: warn
                # N.B : it does not fix the table ! 
      - name: vendor_id
        description: Taxi technology provider (1 = Creative Mobile Technologies, 2 = VeriFone Inc.)
        data_tests:
          - not_null
      - name: rate_code_id
        description: Rate code at end of trip (1=Standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=Negotiated, 6=Group)
      - name: pickup_location_id
        description: TLC Taxi Zone where the meter was engaged
        data_tests: 
          - relationships:
              arguments:
                to: ref('taxi_zone_lookup')
                field: locationid 
              config:
                severity: warn
      - name: dropoff_location_id
        description: TLC Taxi Zone where the meter was disengaged
        data_tests: 
          - relationships:
              arguments:
                to: ref('taxi_zone_lookup')
                field: locationid 
              config:
                severity: warn
      - name: pickup_datetime
        description: Date and time when the meter was engaged
        data_tests:
          - not_null
      - name: dropoff_datetime
        description: Date and time when the meter was disengaged
      - name: store_and_fwd_flag
        description: Flag indicating if trip record was held in vehicle memory (Y/N)
      - name: passenger_count
        description: Number of passengers in the vehicle (driver-entered value)
      - name: trip_distance
        description: Trip distance in miles reported by the taximeter
      - name: trip_type
        description: Code for trip type (1=Street-hail, 2=Dispatch)
      - name: fare_amount
        description: Time and distance fare calculated by the meter
      - name: extra
        description: Miscellaneous extras and surcharges (rush hour, overnight)
      - name: mta_tax
        description: $0.50 MTA tax automatically triggered based on meter rate
      - name: tip_amount
        description: Tip amount (credit card tips only, cash tips not included)
      - name: tolls_amount
        description: Total amount of all tolls paid during the trip
      - name: ehail_fee
        description: E-hail service fee
      - name: improvement_surcharge
        description: Improvement surcharge assessed on hailed trips
      - name: total_amount
        description: Total amount charged to passengers (does not include cash tips)
      - name: payment_type
        description: Payment method code (1=Credit card, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided)
        data_tests:
          - accepted_values:
              arguments:
                values: "{{var('payment_type_values')}}"
                quote: false
              config:
                severity: warn
  - name: stg_departments
    description: >
      Staging model for the French departments referential. This model standardizes
      column names and data types from the raw departments source.
    columns:
      - name: department_id
        description: Department code (e.g. "75", "2A")
        data_tests:
          - unique
          - not_null
      - name: department_name
        description: Department name
        data_tests:
          - not_null
      - name: region_id
        description: Id of the region the department belongs to
        data_tests:
          - not_null

  - name: stg_regions
    description: >
      Staging model for the French regions referential. This model standardizes
      column names and data types from the raw regions source.
    columns:
      - name: region_id
        description: Region code
        data_tests:
          - unique
          - not_null
      - name: region_name
        description: Region name
        data_tests:
          - not_null            

  - name: stg_domains
    description: >
      Staging model for the job domains referential.
    columns:
      - name: domain_id
        description: Domain code
        data_tests:
          - unique
          - not_null
      - name: domain_name
        description: Domain label
      - name: domain_name_url
        description: Domain label url

  - name: stg_subdomains
    description: >
      Staging model for the job subdomains referential.
    columns:
      - name: subdomain_id
        description: Subdomain surrogate id
        data_tests:
          - unique
          - not_null
      - name: subdomain_name
        description: Subdomain label
      - name: domain_id
        description: Id of the domain the subdomain belongs to
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_domains')
                field: domain_id
              config:
                severity: warn

  - name: stg_jobs
    description: >
      Staging model for the jobs referential enriched with national attributes.
    columns:
      - name: rome_code
        description: ROME code of the job
        data_tests:
          - unique
          - not_null
      - name: job_name
        description: Job label
      - name: salaryq10
        description: National 10th percentile salary
      - name: salaryq90
        description: National 90th percentile salary
      - name: recruitement_difficulty_score
        description: National recruitment difficulty score
      - name: recruitement_difficulty_score_year
        description: Year the recruitment difficulty score refers to

  - name: stg_jobs_subdomains
    description: >
      Staging model for the bridge table between jobs and subdomains.
    columns:
      - name: rome_code
        description: ROME code of the job
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: rome_code
              config:
                severity: warn
      - name: subdomain_id
        description: Id of the subdomain the job belongs to
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subdomains')
                field: subdomain_id
              config:
                severity: warn

  - name: stg_jobs_departments
    description: >
      Staging model for jobs attributes at department level.
    columns:
      - name: rome_code
        description: ROME code of the job
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jobs')
                field: rome_code
              config:
                severity: warn
      - name: department_id
        description: Department code
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id
              config:
                severity: warn
      - name: job_seekers
        description: Number of job seekers in the department
      - name: job_offers
        description: Number of job offers in the department
      - name: job_period
        description: Period the job offers count refers to
      - name: salaryq10
        description: 10th percentile salary in the department
      - name: salaryq90
        description: 90th percentile salary in the department
      - name: recruitement_difficulty_score
        description: Recruitment difficulty score in the department
      - name: recruitement_difficulty_score_year
        description: Year the recruitment difficulty score refers to

